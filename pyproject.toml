[project]
name = "amoeba"
version = "0.1.0"
description = "Orchestration runner with deterministic control flow and bounded nondeterminism."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amoeba"]
# The shipped answering pipeline file must ship in the wheel, not only exist in a
# source checkout.
artifacts = [
    "src/amoeba/answering/answering.yaml",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 88
# Planning artifacts and the ai-project-guide submodule are documentation, not
# source. The submodule in particular must never be modified by this project.
# CLAUDE.md and AGENTS.md are generated by `cf setup-ide`; their code samples are
# not ours to reformat.
extend-exclude = ["project-documents", "CLAUDE.md", "AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE", "ASYNC", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tier (real sq, real models, real spend) is never collected by a bare
# `uv run pytest`. An explicit `uv run pytest tests/live` still collects it,
# because a path named on the command line is collected regardless of --ignore.
# Run it with the AMOEBA_LIVE_* variables set.
addopts = ["--ignore=tests/live"]
