# Gates every push and pull request.
#
# One job, one Python version — what the project targets today. A matrix would
# be speculative; nothing in this project requires one yet.

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  # Publishes to PyPI on a version tag (vX.Y.Z), only after `check` passes.
  # Trusted publishing (OIDC): no token is stored; PyPI trusts this workflow
  # for the `amoeba` project.
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
